version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: permpoon-system:latest
    container_name: permpoon-system
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
